<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weak Signal Results</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Weak Signal Fusion</p>
      <h1>Collection indicators</h1>
    </div>
    <p class="header-note">When several weak public series rise together, this is a cue to collect more — not a determination of what is happening.</p>
  </header>

  <main>
    <section class="controls" aria-label="Result selection">
      <label>
        <span>Result set</span>
        <select id="result-select"></select>
      </label>
      <label>
        <span>Window</span>
        <select id="window-select"></select>
      </label>
      <label id="series-control">
        <span>Measurement series</span>
        <select id="series-select"></select>
      </label>
    </section>

    <section id="result-summary" class="result-summary" aria-live="polite"></section>

    <nav class="view-tabs" aria-label="Chart views">
      <button type="button" data-view="coupling" aria-pressed="true">Multi-domain coupling</button>
      <button type="button" data-view="series" aria-pressed="false">Individual series</button>
      <button type="button" data-view="all" aria-pressed="false">All series</button>
      <button type="button" data-view="combined" aria-pressed="false">Combined z-scores</button>
      <button type="button" data-view="scatter" aria-pressed="false">Z-score scatter</button>
    </nav>

    <section id="chart-root" aria-live="polite"></section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
